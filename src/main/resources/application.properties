spring.application.name=telegram-miniapp-shop
# variables are in env
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.admin-chat-id=${TELEGRAM_ADMIN_CHAT_ID}
telegram.bot.web-app-url=${TELEGRAM_WEB_APP_URL}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

payment.yookassa.shop-id=${YOOKASSA_SHOP_ID}
payment.yookassa.secret-key=${YOOKASSA_SECRET_KEY}
payment.yookassa.return-url=${YOOKASSA_RETURN_URL}

server.port=8080

# ??????? ??? ?????????? ???????
app.upload-dir=${APP_UPLOAD_DIR:uploads/products}

# ??????????? ??????? ??????????? ??????
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB